    <circle cx="20" cy="17" r="5" fill="#ef4444" />
    <circle cx="36" cy="17" r="5" fill="#f59e0b" />
    <circle cx="52" cy="17" r="5" fill="#10b981" />
    <text x="76" y="21" fill="#64748b" font-size="11">proxmark3@client: [usb] pm3 (CLI Iceman v4.18967)</text>
    <text x="1116" y="21" fill="#38bdf8" font-size="11" text-anchor="end">Modo: Hardware Real USB</text>

    <!-- Console Text Stream -->
    <g transform="translate(24, 60)" font-size="12" line-height="18">
      <text y="0" fill="#38bdf8">[usb] pm3 --&gt; hw tune</text>
      <text y="20" fill="#10b981">[+] LF antenna: 29.42 V @ 125.00 kHz (Optimal)</text>
      <text y="40" fill="#10b981">[+] HF antenna: 11.24 V @ 13.56 MHz (Optimal)</text>
      <text y="60" fill="#64748b">[=] Displaying LC resonance curves... OK</text>

      <text y="95" fill="#38bdf8">[usb] pm3 --&gt; hf 14a info</text>
      <text y="115" fill="#94a3b8">[+] UID:  A4 8F 2B 19</text>
      <text y="135" fill="#94a3b8">[+] ATQA: 00 04  |  SAK: 08 [MIFARE Classic 1K]</text>
      <text y="155" fill="#94a3b8">[+] Chip type: NXP Semiconductors (Crypto-1 PRNG)</text>

      <text y="190" fill="#38bdf8">[usb] pm3 --&gt; hf mf autopwn --1k</text>
      <text y="210" fill="#e2e8f0">[+] Auto-pwn starting on MIFARE Classic 1K...</text>
      <text y="230" fill="#e2e8f0">[+] Loading default dictionary keys (52 standard keys)...</text>
      <text y="250" fill="#10b981">[+] Sector 00 | Key A: A0A1A2A3A4A5 [found] | Key B: B0B1B2B3B4B5 [found]</text>
      <text y="270" fill="#10b981">[+] Sector 01 | Key A: FFFFFFFFFFFF [found] | Key B: FFFFFFFFFFFF [found]</text>
      <text y="290" fill="#10b981">[+] Sector 02 | Key A: D3F7D3F7D3F7 [found] | Key B: FFFFFFFFFFFF [found]</text>
      <text y="310" fill="#f59e0b">[+] Nested attack on Sector 03 (analyzing nonces Nt: 0x48f2b192)...</text>
    </g>

    <!-- Terminal Command Input Bar -->
    <g transform="translate(16, 385)">
      <rect width="1104" height="34" rx="6" fill="#0b1322" stroke="#0369a1" stroke-width="1" />
      <text x="14" y="22" fill="#38bdf8" font-weight="bold">[usb] pm3 --&gt;</text>
      <text x="125" y="22" fill="#f1f5f9">hf mf autopwn --1k</text>
      <rect x="272" y="10" width="8" height="15" fill="#38bdf8" opacity="0.8" />
      <text x="1086" y="22" fill="#64748b" text-anchor="end">Enter ↵</text>
    </g>
  </g>
</svg>
