<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#070b13; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;">
  <defs>
    <linearGradient id="scorecardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1322" />
      <stop offset="100%" stop-color="#05080e" />
    </linearGradient>
    <linearGradient id="roseBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#scorecardBg)" />

  <!-- App Header Compact -->
  <rect x="0" y="0" width="1200" height="54" fill="#0b121e" stroke="#1e293b" stroke-width="1" />
  <g transform="translate(32, 12)">
    <rect width="30" height="30" rx="6" fill="#082f49" stroke="#06b6d4" stroke-width="1.5" />
    <text x="15" y="20" fill="#38bdf8" font-size="12" font-weight="bold" text-anchor="middle">P3</text>
    <text x="40" y="16" fill="#f1f5f9" font-size="14" font-weight="bold" font-family="sans-serif">Proxmark3 Web Studio</text>
    <text x="40" y="28" fill="#64748b" font-size="10" font-family="sans-serif">Módulo: Auditor Forense de Credenciales (Security Scorecard)</text>
  </g>

  <!-- Top Banner: Scorecard and Grade -->
  <g transform="translate(32, 70)">
    <rect width="1136" height="110" rx="14" fill="#091120" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Left Icon & Description -->
    <g transform="translate(24, 24)">
      <rect width="60" height="60" rx="12" fill="#4c0519" stroke="#f43f5e" stroke-width="1.2" />
      <text x="30" y="40" fill="#fb7185" font-size="28" text-anchor="middle">🛡️</text>
      <text x="80" y="26" fill="#f8fafc" font-size="16" font-weight="bold" font-family="sans-serif">
        Auditor de Seguridad de Credenciales (Security Scorecard)
      </text>
      <text x="80" y="46" fill="#94a3b8" font-size="11" font-family="sans-serif">
        Análisis heurístico de clonabilidad, claves públicas de fábrica y vulnerabilidades en la tarjeta activa.
      </text>
    </g>

    <!-- Scorecard Grade Badge -->
    <g transform="translate(940, 16)">
      <rect width="170" height="78" rx="10" fill="#030712" stroke="#e11d48" stroke-width="1.5" />
      <rect x="12" y="12" width="54" height="54" rx="8" fill="url(#roseBadge)" stroke="#f43f5e" stroke-width="1.5" />
      <text x="39" y="47" fill="#ffe4e6" font-size="28" font-weight="900" text-anchor="middle">F</text>
      <text x="78" y="32" fill="#fda4af" font-size="10" font-weight="bold">CLASE DE RIESGO</text>
      <text x="78" y="52" fill="#ffffff" font-size="18" font-weight="bold">35 <tspan font-size="11" fill="#64748b">/ 100</tspan></text>
      <text x="78" y="65" fill="#f43f5e" font-size="9">RIESGO CRÍTICO</text>
    </g>
  </g>

  <!-- Middle Row: Target Info & Export -->
  <g transform="translate(32, 196)">
    <rect width="1136" height="46" rx="8" fill="#080e1a" stroke="#1e293b" stroke-width="1" />
    <text x="20" y="28" fill="#64748b" font-size="11">UID: <tspan fill="#38bdf8" font-weight="bold">A4 8F 2B 19</tspan></text>
    <text x="210" y="28" fill="#64748b" font-size="11">TIPO: <tspan fill="#f1f5f9">MIFARE Classic 1K (NXP)</tspan></text>
    <text x="490" y="28" fill="#64748b" font-size="11">SECTORES: <tspan fill="#10b981" font-weight="bold">16 / 16</tspan></text>
    <text x="680" y="28" fill="#64748b" font-size="11">CLAVES PÚBLICAS: <tspan fill="#f43f5e" font-weight="bold">12 sectores vulnerables</tspan></text>

    <!-- Buttons -->
    <rect x="940" y="10" width="176" height="26" rx="6" fill="#0284c7" />
    <text x="1028" y="27" fill="#ffffff" font-size="11" font-weight="bold" text-anchor="middle">Descargar Informe (.md)</text>
  </g>

  <!-- Findings Cards Grid -->
  <g transform="translate(32, 258)">
    <!-- Finding 1 -->
    <g transform="translate(0, 0)">
      <rect width="556" height="74" rx="8" fill="#0b1322" stroke="#881337" stroke-width="1" />
      <rect x="12" y="12" width="70" height="18" rx="4" fill="#881337" />
      <text x="47" y="24" fill="#fecdd3" font-size="9" font-weight="bold" text-anchor="middle">CRÍTICO</text>
      <text x="92" y="25" fill="#f1f5f9" font-size="12" font-weight="bold" font-family="sans-serif">
        12 sectores con contraseñas de fábrica públicas
      </text>
      <text x="14" y="48" fill="#94a3b8" font-size="10" font-family="sans-serif">
        Se detectaron claves estándar como FFFFFFFFFFFF y A0A1A2A3A4A5. Cualquier smartphone puede volcar y alterar los datos.
      </text>
    </g>

    <!-- Finding 2 -->
    <g transform="translate(580, 0)">
      <rect width="556" height="74" rx="8" fill="#0b1322" stroke="#c2410c" stroke-width="1" />
      <rect x="12" y="12" width="55" height="18" rx="4" fill="#9a3412" />
      <text x="39" y="24" fill="#fed7aa" font-size="9" font-weight="bold" text-anchor="middle">ALTO</text>
      <text x="76" y="25" fill="#f1f5f9" font-size="12" font-weight="bold" font-family="sans-serif">
        Cifrado obsoleto NXP Crypto-1 (Vulnerable a Nested)
      </text>
      <text x="14" y="48" fill="#94a3b8" font-size="10" font-family="sans-serif">
        El algoritmo carece de seguridad frente al Proxmark3. Se recomienda migrar la infraestructura a MIFARE DESFire EV3.
      </text>
    </g>
  </g>

  <!-- Sector Key Matrix Table -->
  <g transform="translate(32, 350)">
    <rect width="1136" height="295" rx="10" fill="#04070e" stroke="#1e293b" stroke-width="1.2" />
    
    <!-- Table Header -->
    <rect width="1136" height="32" rx="10" fill="#0c1524" />
    <text x="24" y="21" fill="#94a3b8" font-size="11" font-weight="bold">SECTOR</text>
    <text x="160" y="21" fill="#94a3b8" font-size="11" font-weight="bold">KEY A (HEX)</text>
    <text x="360" y="21" fill="#94a3b8" font-size="11" font-weight="bold">KEY B (HEX)</text>
    <text x="560" y="21" fill="#94a3b8" font-size="11" font-weight="bold">BITS DE ACCESO</text>
    <text x="820" y="21" fill="#94a3b8" font-size="11" font-weight="bold">ESTADO DE RIESGO</text>

    <!-- Table Rows -->
    <g transform="translate(24, 52)" font-size="11">
      <!-- Row 0 -->
      <text y="0" fill="#f8fafc" font-weight="bold">Sector 00</text>
      <text x="136" y="0" fill="#f43f5e">A0A1A2A3A4A5 <tspan font-size="9" fill="#fda4af">[DEFAULT]</tspan></text>
      <text x="336" y="0" fill="#f43f5e">B0B1B2B3B4B5 <tspan font-size="9" fill="#fda4af">[DEFAULT]</tspan></text>
      <text x="536" y="0" fill="#64748b">FF 07 80 69</text>
      <rect x="790" y="-12" width="130" height="18" rx="4" fill="#4c0519" stroke="#f43f5e" stroke-width="0.8" />
      <text x="855" y="1" fill="#fecdd3" font-size="10" text-anchor="middle">⚠️ CLAVE PÚBLICA</text>

      <!-- Row 1 -->
      <text y="30" fill="#f8fafc" font-weight="bold">Sector 01</text>
      <text x="136" y="30" fill="#f43f5e">FFFFFFFFFFFF <tspan font-size="9" fill="#fda4af">[DEFAULT]</tspan></text>
      <text x="336" y="30" fill="#f43f5e">FFFFFFFFFFFF <tspan font-size="9" fill="#fda4af">[DEFAULT]</tspan></text>
      <text x="536" y="30" fill="#64748b">FF 07 80 69</text>
      <rect x="790" y="18" width="130" height="18" rx="4" fill="#4c0519" stroke="#f43f5e" stroke-width="0.8" />
      <text x="855" y="31" fill="#fecdd3" font-size="10" text-anchor="middle">⚠️ CLAVE PÚBLICA</text>

      <!-- Row 2 -->
      <text y="60" fill="#f8fafc" font-weight="bold">Sector 02</text>
      <text x="136" y="60" fill="#f43f5e">D3F7D3F7D3F7 <tspan font-size="9" fill="#fda4af">[DEFAULT]</tspan></text>
      <text x="336" y="60" fill="#f43f5e">FFFFFFFFFFFF <tspan font-size="9" fill="#fda4af">[DEFAULT]</tspan></text>
      <text x="536" y="60" fill="#64748b">FF 07 80 69</text>
      <rect x="790" y="48" width="130" height="18" rx="4" fill="#4c0519" stroke="#f43f5e" stroke-width="0.8" />
      <text x="855" y="61" fill="#fecdd3" font-size="10" text-anchor="middle">⚠️ CLAVE PÚBLICA</text>

      <!-- Row 3 -->
      <text y="90" fill="#f8fafc" font-weight="bold">Sector 03</text>
      <text x="136" y="90" fill="#10b981">8F4A19B277C0</text>
      <text x="336" y="90" fill="#10b981">E21C94AA5803</text>
      <text x="536" y="90" fill="#64748b">7F 07 88 40</text>
      <rect x="790" y="78" width="130" height="18" rx="4" fill="#064e3b" stroke="#10b981" stroke-width="0.8" />
      <text x="855" y="91" fill="#a7f3d0" font-size="10" text-anchor="middle">✓ PERSONALIZADA</text>
    </g>
  </g>
</svg>
